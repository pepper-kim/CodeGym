<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .world {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60vw;
      height: 60vh;
      background-color: blanchedalmond;
      perspective: 500px;
    }
    .card {
      position: relative;
      width: 100px;
      height: 150px;
      margin: 1em;
      transform: rotateY(0deg);
      transition: 1s;
      transform-style: preserve-3d;
      transform-origin: left;
    }
    .card-side {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      border-radius: 0.5em;
      font-size: 1.5rem;
      backface-visibility: hidden;
    }
    .card-side-front {
      z-index: 1;
      background: white;
    }
    .card-side-back {
      transform: rotateY(180deg);
      background: pink;
    }
    .world:hover .card {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="world">
    <div class="card">
      <div class="card-side card-side-front">민석 ♥️</div>
      <div class="card-side card-side-back">♥️ 혜지</div>
    </div>
  </div>
</body>
</html>
