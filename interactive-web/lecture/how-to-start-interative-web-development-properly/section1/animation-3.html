<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: #222;
    }
    @keyframes spaceship-ani {
      to {
        background-position: -2550px 0; /* 배경이 왼쪽으로 움직여야 앞으로 가는 효과가 나기 때문에 음수 값을 사용함. */
      }
    }
    .spaceship {
      width: 150px;
      height: 150px;
      background: url('images/sprite_spaceship.png') no-repeat 0 0 / auto 150px;
      animation: spaceship-ani 2s infinite steps(17);
    }
  </style>
</head>
<body>
  <div class="spaceship"></div>
</html>
