<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @keyframes ball-ani {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(200px, 200px);
      }
    }
    .ball {
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      margin: -15px 0 0 -15px;
      border-radius: 50%;
      background: red;
      /* animation: ball-ani 1s 3 alternate forwards; */
    }
    .ball.end {
      background: dodgerblue;
    }
  </style>
</head>
<body>
  <div class="ball"></div>
  <script>
    const ballElem = document.querySelector('.ball');

    // window.addEventListener('click', (e) => {
    //   console.log(e.clientX, e.clientY);
    //   ballElem.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    // });

    // ballElem.addEventListener('transitionstart', (e) => {
    //   ballElem.classList.add('end');
    //   console.log(e.elapsedTime);
    //   console.log(e.propertyName);
    // });

    ballElem.addEventListener('click', (e) => {
      ballElem.style.animation = 'ball-ani 1s 3 alternate forwards';
    });

    ballElem.addEventListener('animationend', (e) => {
      ballElem.classList.add('end');
      console.log(e.elapsedTime);
      console.log(e.propertyName);
    });
  </script>
</body>
</html>
