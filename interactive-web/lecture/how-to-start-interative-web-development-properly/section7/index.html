<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: #333;
    }
    .door {
      position: relative;
      width: 100px;
      height: 150px;
    }
    .door-back {
      position: absolute;
      left: 0;
      top: 0;
      width: 100px;
      height: 150px;
      background: black;
      overflow: hidden;
    }
    .ilbuni {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100px;
      height: 100px;
      background-repeat: no-repeat;
      background-position: 50% 100%;
      background-size: contain;
      transform: translate3d(100%, 0, 0);
      transition: 0.5s 0.5s;
    }
    .door:nth-child(1) .ilbuni {
      background-image: url('./images/ilbuni_0.png');
    }
    .door:nth-child(2) .ilbuni {
      background-image: url('./images/ilbuni_1.png');
    }
    .door:nth-child(3) .ilbuni {
      background-image: url('./images/ilbuni_2.png');
    }
    .door-body {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform-origin: left;
      transition: 0.5s;
    }
    .door:nth-child(1) .door-body {
      background: rgba(255, 0, 0, 0.7);
    }
    .door:nth-child(2) .door-body {
      background: rgba(0, 255, 0, 0.7);
    }
    .door:nth-child(3) .door-body {
      background: rgba(0, 0, 255, 0.7);
    }
    .door-opened .ilbuni {
      transform: translate3d(0, 0, 0);
    }
    .door-opened .door-body {
      transform: perspective(800px) rotateY(-110deg);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="door">
      <div class="door-back">
        <div class="ilbuni"></div>
      </div>
      <div class="door-body"></div>
    </div>
    <div class="door">
      <div class="door-back">
        <div class="ilbuni"></div>
      </div>
      <div class="door-body"></div>
    </div>
    <div class="door">
      <div class="door-back">
        <div class="ilbuni"></div>
      </div>
      <div class="door-body"></div>
    </div>
  </div>
  <script>
    {
      const stage = document.querySelector('.stage');
      let openedDoor;

      function activate(door) {
        door.classList.add('door-opened');
        openedDoor = door;
      }

      function inActivate(element) {
        element.classList.remove('door-opened');
      }

      function doorHandler(e) {
        if (openedDoor) {
          inActivate(openedDoor);
        }

        const door = e.target.closest('.door');
        if (door) {
          activate(door);
        }
      }

      stage.addEventListener('click', doorHandler);

      activate(stage.querySelector('.door:nth-child(1)'));
    }
  </script>
</body>
</html>
